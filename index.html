<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a" id="themeColorMeta">
<title>Freedom — Lounge, Bar &amp; Restaurant</title>
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    var t = localStorage.getItem('freedom_theme') === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  /* Shown for the moment between tapping a language and the menu page
     taking over, so that tap feels responsive instead of dead —
     especially noticeable on a slow connection. */
  #pageLoader {
    position:fixed; inset:0; z-index:9999;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    background:#0a0a0a;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .3s ease, visibility .3s ease;
  }
  :root[data-theme="light"] #pageLoader { background:#faf6ef; }
  #pageLoader.loader-visible { opacity:1; visibility:visible; pointer-events:all; }
  #pageLoader .loader-icon {
    width:46px; height:46px; color:#c9a04b;
    animation:loaderPulse 1.6s ease-in-out infinite;
  }
  :root[data-theme="light"] #pageLoader .loader-icon { color:#a97a2e; }
  #pageLoader .loader-bar {
    width:120px; height:3px; border-radius:3px; overflow:hidden;
    background:rgba(201,160,75,.18);
  }
  #pageLoader .loader-bar::after {
    content:''; display:block; width:40%; height:100%; border-radius:3px;
    background:#c9a04b;
    animation:loaderSlide 1.1s ease-in-out infinite;
  }
  :root[data-theme="light"] #pageLoader .loader-bar { background:rgba(169,122,46,.18); }
  :root[data-theme="light"] #pageLoader .loader-bar::after { background:#a97a2e; }
  @keyframes loaderPulse { 0%,100%{ opacity:.55; transform:scale(.94); } 50%{ opacity:1; transform:scale(1); } }
  @keyframes loaderSlide { 0%{ transform:translateX(-110%); } 100%{ transform:translateX(360%); } }
  #pageLoader .loader-msg {
    font-family:'Inter', sans-serif; font-size:14px; color:#cdb99c; text-align:center;
    max-width:260px; line-height:1.5;
  }
  #pageLoader .loader-retry {
    font-family:'Inter', sans-serif; font-size:14px; font-weight:600;
    color:#0a0a0a; background:#c9a04b; border:none; border-radius:8px;
    padding:10px 22px; cursor:pointer;
  }
  :root[data-theme="light"] #pageLoader .loader-retry { color:#faf6ef; background:#a97a2e; }
  #pageLoader.loader-error .loader-icon,
  #pageLoader.loader-error .loader-bar { display:none; }
</style>
</head>
<body>

<div id="pageLoader" aria-hidden="true">
  <svg class="loader-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M29 58c-1.5-12 0.5-23 7-32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M36 26c-8-3-17-2-23 4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M36 26c-9 1-16 6-19 13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M36 26c1-9 7-15 16-17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M36 26c7-3 15-2 20 3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M36 26c-1-9-6-15-14-18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M36 26c8 1 14 7 15 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
  <div class="loader-bar"></div>
  <div class="loader-msg" id="loaderMsg" hidden>Connection seems slow. Please check your internet and try again.</div>
  <button class="loader-retry" id="loaderRetry" type="button" hidden>Try again</button>
</div>

<button class="theme-toggle theme-toggle-standalone" id="themeToggle" type="button" aria-label="Switch between dark and light theme">
  <span class="theme-toggle-icon icon-sun">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </span>
  <span class="theme-toggle-icon icon-moon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
  </span>
  <span class="theme-toggle-thumb" id="themeToggleThumb"></span>
</button>

<div class="intro-wrap">
  <svg class="intro-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M29 58c-1.5-12 0.5-23 7-32" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M36 26c-8-3-17-2-23 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M36 26c-9 1-16 6-19 13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M36 26c1-9 7-15 16-17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M36 26c7-3 15-2 20 3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M36 26c-1-9-6-15-14-18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M36 26c8 1 14 7 15 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </svg>

  <div class="intro-eyebrow" id="introEyebrow">Welcome</div>
  <div class="intro-title">Freedom</div>
  <div class="intro-tagline" id="introTagline">Lounge, Bar &amp; Restaurant</div>

  <div class="intro-prompt" id="introPrompt">Choose your language</div>
  <div class="intro-sub" id="introSub">Select a language to view the menu.</div>

  <div class="lang-grid" id="langGrid"></div>

  <div class="intro-foot" id="introFoot"></div>
</div>

<script src="i18n.js"></script>
<script>
const LANG_LIST = CafeI18n.LANGS;

const introEyebrow = document.getElementById('introEyebrow');
const introTagline = document.getElementById('introTagline');
const introPrompt  = document.getElementById('introPrompt');
const introSub     = document.getElementById('introSub');
const langGrid     = document.getElementById('langGrid');
const introFoot    = document.getElementById('introFoot');

/* Render the 6 language buttons, each labelled in its own language. */
langGrid.innerHTML = LANG_LIST.map(l => `
  <button class="lang-btn" data-code="${l.code}" type="button">
    <span class="lang-btn-native">${l.label}</span>
  </button>
`).join('');

/* Selecting a language only affects the menu page — the intro page
   itself always stays in English, regardless of which language is
   chosen for the menu (or Arabic being the menu's reference language
   internally). */
const pageLoader  = document.getElementById('pageLoader');
const loaderMsg   = document.getElementById('loaderMsg');
const loaderRetry = document.getElementById('loaderRetry');
let pendingCode = null;
let requestToken = 0;

function showLoading() {
  pageLoader.classList.remove('loader-error');
  loaderMsg.hidden = true;
  loaderRetry.hidden = true;
  pageLoader.classList.add('loader-visible');
}

function showLoadError() {
  pageLoader.classList.add('loader-error');
  loaderMsg.hidden = false;
  loaderRetry.hidden = false;
}

/* Confirms the menu page and its (large) menu-data file are actually
   reachable before navigating, instead of blindly changing pages —
   on a bad connection that blind navigation can hang or fail and
   strand the guest on a broken/blank page with no way back. Opened
   straight from disk (file://) skips the check, since fetch() can't
   read local files there and there's no "slow internet" to guard
   against in that case anyway. */
function goToMenu(code) {
  pendingCode = code;
  showLoading();
  const myToken = ++requestToken;

  if (location.protocol === 'file:') {
    window.location.href = 'menu.html';
    return;
  }

  const controller = new AbortController();
  const timeout = window.setTimeout(() => controller.abort(), 12000);

  Promise.all([
    fetch('menu.html', { signal: controller.signal }),
    fetch('i18n.js', { signal: controller.signal }),
  ])
    .then(([menuRes, dataRes]) => {
      window.clearTimeout(timeout);
      if (myToken !== requestToken) return; // superseded (e.g. came back via bfcache)
      if (!menuRes.ok || !dataRes.ok) throw new Error('bad response');
      window.location.href = 'menu.html';
    })
    .catch(() => {
      window.clearTimeout(timeout);
      if (myToken !== requestToken) return;
      showLoadError();
    });
}

langGrid.querySelectorAll('.lang-btn').forEach(btn => {
  const code = btn.dataset.code;
  btn.addEventListener('click', () => {
    CafeI18n.saveLang(code);
    goToMenu(code);
  });
});

loaderRetry.addEventListener('click', () => {
  if (pendingCode) goToMenu(pendingCode);
});

/* Guards against the browser's back/forward cache: hitting "back" from
   menu.html doesn't reload this page, it restores the exact DOM state
   it was frozen in — which, if a language was just tapped, is mid
   loading-screen. Without this, the guest would land back here stuck
   behind the loader until a second back-tap forced a real reload. */
window.addEventListener('pageshow', (e) => {
  if (e.persisted) {
    pendingCode = null;
    requestToken++; // invalidate any in-flight preload check from before we left
    pageLoader.classList.remove('loader-visible', 'loader-error');
    loaderMsg.hidden = true;
    loaderRetry.hidden = true;
    // The theme may have been changed on menu.html while we were away —
    // a bfcache restore doesn't re-run our head script, so re-sync it
    // from storage instead of showing whatever this page was frozen with.
    const theme = CafeI18n.getTheme();
    CafeI18n.applyTheme(theme);
    reflectThemeColor(theme);
  }
});

/* Little multilingual footer line cycling through "select a language" translations. */
introFoot.textContent = LANG_LIST.map(l => l.label).join(' · ');

/* ── Theme toggle ── */
const themeToggle = document.getElementById('themeToggle');
const themeColorMeta = document.getElementById('themeColorMeta');

function reflectThemeColor(theme) {
  themeColorMeta.setAttribute('content', theme === 'light' ? '#faf6ef' : '#0a0a0a');
}

reflectThemeColor(CafeI18n.getTheme());

themeToggle.addEventListener('click', () => {
  const next = CafeI18n.getTheme() === 'light' ? 'dark' : 'light';
  CafeI18n.saveTheme(next);
  CafeI18n.applyTheme(next);
  reflectThemeColor(next);
});
</script>
</body>
</html>
