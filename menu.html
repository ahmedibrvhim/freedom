<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a" id="themeColorMeta">
<title>Freedom — Menu</title>
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    var t = localStorage.getItem('freedom_theme') === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    // Arabic is the reference/default language, so set lang/dir before
    // first paint to avoid a flash of LTR layout on load.
    var l = localStorage.getItem('freedom_lang') || 'ar';
    document.documentElement.setAttribute('lang', l);
    document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
  })();
</script>
<!-- Critical, inline (no extra network request) so this paints instantly
     even before style.css / i18n.js finish downloading on a slow
     connection — that's the "frozen blank screen" this replaces. -->
<style>
  #pageLoader {
    position:fixed; inset:0; z-index:9999;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    background:#0a0a0a;
    transition:opacity .45s ease, visibility .45s ease;
  }
  :root[data-theme="light"] #pageLoader { background:#faf6ef; }
  #pageLoader.loader-hidden { opacity:0; visibility:hidden; pointer-events:none; }
  #pageLoader .loader-icon {
    width:46px; height:46px; color:#c9a04b;
    animation:loaderPulse 1.6s ease-in-out infinite;
  }
  :root[data-theme="light"] #pageLoader .loader-icon { color:#a97a2e; }
  #pageLoader .loader-bar {
    width:120px; height:3px; border-radius:3px; overflow:hidden;
    background:rgba(201,160,75,.18);
  }
  #pageLoader .loader-bar::after {
    content:''; display:block; width:40%; height:100%; border-radius:3px;
    background:#c9a04b;
    animation:loaderSlide 1.1s ease-in-out infinite;
  }
  :root[data-theme="light"] #pageLoader .loader-bar { background:rgba(169,122,46,.18); }
  :root[data-theme="light"] #pageLoader .loader-bar::after { background:#a97a2e; }
  @keyframes loaderPulse { 0%,100%{ opacity:.55; transform:scale(.94); } 50%{ opacity:1; transform:scale(1); } }
  @keyframes loaderSlide { 0%{ transform:translateX(-110%); } 100%{ transform:translateX(360%); } }
</style>
</head>
<body>

<div id="pageLoader" aria-hidden="true">
  <svg class="loader-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M29 58c-1.5-12 0.5-23 7-32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M36 26c-8-3-17-2-23 4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M36 26c-9 1-16 6-19 13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M36 26c1-9 7-15 16-17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M36 26c7-3 15-2 20 3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M36 26c-1-9-6-15-14-18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M36 26c8 1 14 7 15 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
  <div class="loader-bar"></div>
</div>
<script>
  // Safety net: if i18n.js fails to load or hangs on a very slow
  // connection, never leave the guest staring at the loader forever.
  window.setTimeout(() => {
    const l = document.getElementById('pageLoader');
    if (l) l.classList.add('loader-hidden');
  }, 12000);
</script>

<nav class="site-nav">
  <a class="brand-mark" href="index.html">
    <svg class="brand-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M29 58c-1.5-12 0.5-23 7-32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M36 26c-8-3-17-2-23 4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M36 26c-9 1-16 6-19 13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M36 26c1-9 7-15 16-17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M36 26c7-3 15-2 20 3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M36 26c-1-9-6-15-14-18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M36 26c8 1 14 7 15 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <span>
      <span class="brand-word" id="brandWord">Freedom</span>
    </span>
  </a>

  <div class="nav-actions">
    <div class="lang-switch" id="langSwitch">
      <button class="lang-switch-btn" id="langSwitchBtn" type="button">
        <span id="langSwitchLabel">English</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="lang-switch-menu" id="langSwitchMenu"></div>
    </div>

    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch between dark and light theme">
      <span class="theme-toggle-icon icon-sun">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </span>
      <span class="theme-toggle-icon icon-moon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
      </span>
      <span class="theme-toggle-thumb" id="themeToggleThumb"></span>
    </button>
  </div>
</nav>

<header class="menu-hero">
  <div class="menu-hero-eyebrow" id="menuHeroEyebrow">Menu</div>
  <div class="menu-hero-title" id="menuHeroTitle">Freedom</div>
  <div class="menu-hero-sub" id="menuHeroSub">Roasted daily, served with care.</div>
</header>

<div class="cat-tabs" id="catTabs"></div>

<main class="menu-body" id="menuBody"></main>

<footer class="site-foot">
  <div class="foot-brand" id="footBrand">Freedom</div>
  <div class="foot-row"><span class="label" id="footHoursLabel">Open daily</span><span id="footHoursValue">8:00 – 22:00</span></div>
  <div class="foot-row"><span class="label" id="footAddressLabel">Find us</span><span id="footAddressValue">123 Coffee Street, Giza</span></div>
  <div class="foot-note" id="footNote">Prices include tax. Ask your server about seasonal specials.</div>
</footer>

<script src="i18n.js"></script>
<script>
const LANG_LIST = CafeI18n.LANGS;
const MENU_DATA = CafeI18n.menuData;

let lang = CafeI18n.getLang() || 'ar'; // Arabic is the reference/default language
CafeI18n.applyDocumentDirection(lang);

const brandWord      = document.getElementById('brandWord');
const langSwitch      = document.getElementById('langSwitch');
const langSwitchBtn   = document.getElementById('langSwitchBtn');
const langSwitchLabel = document.getElementById('langSwitchLabel');
const langSwitchMenu  = document.getElementById('langSwitchMenu');
const menuHero        = document.querySelector('.menu-hero');
const siteFoot        = document.querySelector('.site-foot');
const menuHeroEyebrow = document.getElementById('menuHeroEyebrow');
const menuHeroTitle   = document.getElementById('menuHeroTitle');
const menuHeroSub     = document.getElementById('menuHeroSub');
const catTabs         = document.getElementById('catTabs');
const menuBody        = document.getElementById('menuBody');
const footBrand       = document.getElementById('footBrand');
const footHoursLabel  = document.getElementById('footHoursLabel');
const footHoursValue  = document.getElementById('footHoursValue');
const footAddressLabel= document.getElementById('footAddressLabel');
const footAddressValue= document.getElementById('footAddressValue');
const footNote        = document.getElementById('footNote');

let activeCat = null;

function renderLangMenu() {
  langSwitchMenu.innerHTML = LANG_LIST.map(l => `
    <button class="lang-switch-item${l.code === lang ? ' active' : ''}" data-code="${l.code}" type="button">
      <span>${l.label}</span>
    </button>
  `).join('');
  langSwitchMenu.querySelectorAll('.lang-switch-item').forEach(item => {
    item.addEventListener('click', () => {
      setLang(item.dataset.code);
      langSwitch.classList.remove('open');
    });
  });
}

function renderTabs() {
  const cats = MENU_DATA[lang];
  catTabs.innerHTML = cats.map(c => `
    <button class="cat-tab${c.id === activeCat ? ' active' : ''}" data-id="${c.id}" type="button">${c.name}</button>
  `).join('');
  catTabs.querySelectorAll('.cat-tab').forEach(tab => {
    tab.addEventListener('click', () => switchCategory(tab.dataset.id));
  });
}

/* Renders a category's optional one-line hint (only if non-empty for
   this language) right under its name — this is where the
   CATEGORY_HINTS text from i18n.js shows up for guests. */
function renderHint(hint) {
  return hint ? `<p class="menu-hint">${hint}</p>` : '';
}

function renderItems(items, currency) {
  if (!items.length) {
    return `<p class="menu-coming-soon">${CafeI18n.t('menu_coming_soon', lang)}</p>`;
  }
  return items.map(item => `
    <div class="menu-item">
      <div class="menu-item-row">
        <span class="menu-item-name">${item.name}</span>
        <span class="menu-item-leader"></span>
        <span class="menu-item-price">${item.price} ${currency}</span>
      </div>
      <p class="menu-item-desc">${item.desc}</p>
    </div>
  `).join('');
}

/* Renders a category at any depth: level 1 = top-level section (Food,
   Drinks, Shisha Pipes...), level 2 = subcategory (Breakfast, Hot
   Drinks...), level 3 = sub-subcategory (Meat, Chicken, Fish under Main
   Dishes). Only level-1 sections get the scroll-target id used by tabs. */
function renderCategory(cat, level, currency) {
  const headingTag   = level === 1 ? 'h2' : level === 2 ? 'h3' : 'h4';
  const headingClass = level === 1 ? 'menu-section-title' : level === 2 ? 'menu-subsection-title' : 'menu-subsubsection-title';
  const wrapTag       = level === 1 ? 'section' : 'div';
  const wrapClass     = level === 1 ? 'menu-section' : level === 2 ? 'menu-subsection' : 'menu-subsubsection';
  const idAttr        = level === 1 ? ` id="sec-${cat.id}"` : '';
  const body = cat.children
    ? cat.children.map(child => renderCategory(child, level + 1, currency)).join('')
    : renderItems(cat.items || [], currency);
  return `<${wrapTag} class="${wrapClass}"${idAttr}>
      <${headingTag} class="${headingClass}">${cat.name}</${headingTag}>
      ${renderHint(cat.hint)}
      ${body}
    </${wrapTag}>`;
}

function renderMenu() {
  const cats = MENU_DATA[lang];
  const currency = CafeI18n.t('currency', lang);
  const active = cats.find(c => c.id === activeCat) || cats[0];
  menuBody.innerHTML = renderCategory(active, 1, currency);
}

/* Swaps the visible category with a short fade instead of an instant
   cut, then scrolls the panel into view (useful once a category's
   content is taller/shorter than the previous one). */
function switchCategory(id) {
  if (id === activeCat) return;
  activeCat = id;
  renderTabs();
  menuBody.classList.add('is-switching');
  window.setTimeout(() => {
    renderMenu();
    menuBody.classList.remove('is-switching');
    menuBody.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 180);
}

/* Keeps whichever category the guest was looking at when they switch
   language (category ids are language-independent), falling back to
   the first category only the very first time, when nothing is
   selected yet. Runs the whole update through the same short fade
   used for category switching so the language change feels smooth
   instead of an abrupt content jump. */
function setLang(code) {
  const isFirstLoad = activeCat === null;
  const hadCat = activeCat;

  lang = code;
  CafeI18n.saveLang(lang);
  CafeI18n.applyDocumentDirection(lang);

  const cats = MENU_DATA[lang];
  activeCat = (!isFirstLoad && cats.some(c => c.id === hadCat))
    ? hadCat
    : cats[0].id;

  function applyText() {
    brandWord.textContent = CafeI18n.t('brand_name', lang);
    footBrand.textContent = CafeI18n.t('brand_name', lang);
    langSwitchLabel.textContent = LANG_LIST.find(l => l.code === lang).label;
    menuHeroEyebrow.textContent = CafeI18n.t('nav_menu', lang);
    menuHeroTitle.textContent = CafeI18n.t('brand_name', lang);
    menuHeroSub.textContent = CafeI18n.t('menu_hero_sub', lang);
    footHoursLabel.textContent = CafeI18n.t('footer_hours_label', lang);
    footHoursValue.textContent = CafeI18n.t('footer_hours_value', lang);
    footAddressLabel.textContent = CafeI18n.t('footer_address_label', lang);
    footAddressValue.textContent = CafeI18n.t('footer_address_value', lang);
    footNote.textContent = CafeI18n.t('footer_note', lang);

    renderLangMenu();
    renderTabs();
    renderMenu();
  }

  if (isFirstLoad) {
    // No fade needed on initial page load.
    applyText();
    return;
  }

  const fadeEls = [menuHero, catTabs, menuBody, siteFoot];
  fadeEls.forEach(el => el.classList.add('is-switching'));
  window.setTimeout(() => {
    applyText();
    fadeEls.forEach(el => el.classList.remove('is-switching'));
  }, 180);
}

langSwitchBtn.addEventListener('click', () => langSwitch.classList.toggle('open'));
document.addEventListener('click', (e) => {
  if (!langSwitch.contains(e.target)) langSwitch.classList.remove('open');
});

setLang(lang);

/* Content is rendered synchronously above, so the loader can come down
   now — a tiny extra delay + fade keeps the swap feeling smooth rather
   than an abrupt cut, and covers the case where fonts/CSS are still
   settling in on a slow connection. */
(function hidePageLoader() {
  const loader = document.getElementById('pageLoader');
  if (!loader) return;
  window.requestAnimationFrame(() => {
    window.setTimeout(() => {
      loader.classList.add('loader-hidden');
      window.setTimeout(() => loader.remove(), 500);
    }, 150);
  });
})();

/* ── Theme toggle ── */
const themeToggle = document.getElementById('themeToggle');
const themeColorMeta = document.getElementById('themeColorMeta');

function reflectThemeColor(theme) {
  themeColorMeta.setAttribute('content', theme === 'light' ? '#faf6ef' : '#0a0a0a');
}

reflectThemeColor(CafeI18n.getTheme());

themeToggle.addEventListener('click', () => {
  const next = CafeI18n.getTheme() === 'light' ? 'dark' : 'light';
  CafeI18n.saveTheme(next);
  CafeI18n.applyTheme(next);
  reflectThemeColor(next);
});

/* Same bfcache issue as index.html: coming back here via the browser's
   back/forward buttons restores the exact page as it was frozen, not a
   fresh load — so it won't reflect a theme (or language) change made on
   index.html in the meantime unless we re-sync from storage here. */
window.addEventListener('pageshow', (e) => {
  if (e.persisted) {
    const theme = CafeI18n.getTheme();
    CafeI18n.applyTheme(theme);
    reflectThemeColor(theme);

    const storedLang = CafeI18n.getLang() || 'ar';
    if (storedLang !== lang) {
      setLang(storedLang);
    }
  }
});
</script>
</body>
</html>
